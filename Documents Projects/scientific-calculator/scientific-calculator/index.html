<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1321">
  <title>NEXUS Scientific Calculator</title>

  <!-- Apply the saved theme BEFORE the page is drawn (prevents a dark/light flash) -->
  <script>
    try {
      var savedTheme = JSON.parse(localStorage.getItem('nexus.theme'));
      if (savedTheme === 'light' || savedTheme === 'dark') {
        document.documentElement.setAttribute('data-theme', savedTheme);
      }
    } catch (e) { /* storage not available: keep the dark default */ }
  </script>

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage">
    <div class="calc" id="calc">

      <!-- ===== HEADER: brand + theme / scientific / history buttons ===== -->
      <header class="top">
        <div class="brand">
          <h1>NEXUS<span>.</span></h1>
          <p>Scientific Calculator</p>
        </div>
        <div class="tools">
          <button type="button" class="icon-btn" id="themeBtn" aria-label="Switch to light theme" title="Theme">
            <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          </button>
          <button type="button" class="icon-btn sci-toggle" id="sciBtn" aria-label="Show scientific keys" aria-expanded="false" aria-controls="sciKeys" title="Scientific keys">
            <span aria-hidden="true">ƒx</span>
          </button>
          <button type="button" class="icon-btn" id="historyBtn" aria-label="Open history" title="History (H)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/></svg>
          </button>
        </div>
      </header>

      <!-- ===== DISPLAY ===== -->
      <section class="screen" id="screen" aria-label="Display">
        <div class="screen-top">
          <div class="seg" role="group" aria-label="Angle mode">
            <button type="button" data-angle="DEG" aria-pressed="true">DEG</button>
            <button type="button" data-angle="RAD" aria-pressed="false">RAD</button>
          </div>
          <span class="mem-badge" id="memBadge" hidden>M</span>
          <button type="button" class="copy-btn" id="copyBtn" aria-label="Copy result">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>
            <span>COPY</span>
          </button>
        </div>
        <div class="sub" id="sub" role="status"></div>
        <div class="main" id="main">0</div>
      </section>

      <!-- ===== MEMORY KEYS ===== -->
      <section class="mem" aria-label="Memory">
        <button type="button" class="key mini" data-action="mc" aria-label="Memory clear">MC</button>
        <button type="button" class="key mini" data-action="mr" aria-label="Memory recall">MR</button>
        <button type="button" class="key mini" data-action="mplus" aria-label="Memory add">M+</button>
        <button type="button" class="key mini" data-action="mminus" aria-label="Memory subtract">M−</button>
      </section>

      <div class="body">

        <!-- ===== SCIENTIFIC KEYS (5 columns) ===== -->
        <section class="sci" id="sciKeys" aria-label="Scientific functions">
          <button type="button" class="key fn" data-insert="sin(">sin</button>
          <button type="button" class="key fn" data-insert="cos(">cos</button>
          <button type="button" class="key fn" data-insert="tan(">tan</button>
          <button type="button" class="key fn" data-insert="(" aria-label="Open bracket">(</button>
          <button type="button" class="key fn" data-insert=")" aria-label="Close bracket">)</button>

          <button type="button" class="key fn" data-insert="asin(" aria-label="Inverse sine">sin<sup>−1</sup></button>
          <button type="button" class="key fn" data-insert="acos(" aria-label="Inverse cosine">cos<sup>−1</sup></button>
          <button type="button" class="key fn" data-insert="atan(" aria-label="Inverse tangent">tan<sup>−1</sup></button>
          <button type="button" class="key fn const" data-insert="π" aria-label="Pi">π</button>
          <button type="button" class="key fn const" data-insert="e" aria-label="Euler's number">e</button>

          <button type="button" class="key fn" data-post="²" aria-label="Square">x<sup>2</sup></button>
          <button type="button" class="key fn" data-post="³" aria-label="Cube">x<sup>3</sup></button>
          <button type="button" class="key fn" data-op="^" aria-label="Power">x<sup>y</sup></button>
          <button type="button" class="key fn" data-insert="√(" aria-label="Square root">√</button>
          <button type="button" class="key fn" data-insert="∛(" aria-label="Cube root"><sup>3</sup>√</button>

          <button type="button" class="key fn" data-insert="recip(" aria-label="Reciprocal">1/x</button>
          <button type="button" class="key fn" data-post="!" aria-label="Factorial">n!</button>
          <button type="button" class="key fn" data-insert="abs(" aria-label="Absolute value">|x|</button>
          <button type="button" class="key fn" data-insert="exp(" aria-label="e to the power x">e<sup>x</sup></button>
          <button type="button" class="key fn" data-insert="ln(" aria-label="Natural logarithm">ln</button>

          <button type="button" class="key fn" data-insert="log(" aria-label="Logarithm base 10">log</button>
          <button type="button" class="key fn" data-insert="10^(" aria-label="10 to the power x">10<sup>x</sup></button>
          <button type="button" class="key fn const" data-insert="Ans" aria-label="Previous answer">Ans</button>
          <button type="button" class="key fn" data-action="mod" aria-label="Modulo">mod</button>
          <button type="button" class="key fn" data-post="°" aria-label="Degree sign">°</button>
        </section>

        <!-- ===== MAIN KEYPAD (4 columns) ===== -->
        <section class="keys" aria-label="Keypad">
          <button type="button" class="key utility" data-action="clear" aria-label="All clear">AC</button>
          <button type="button" class="key utility" data-action="delete" aria-label="Delete last">DEL</button>
          <button type="button" class="key utility" data-post="%" aria-label="Percent">%</button>
          <button type="button" class="key operator" data-op="÷" aria-label="Divide">÷</button>

          <button type="button" class="key" data-digit="7">7</button>
          <button type="button" class="key" data-digit="8">8</button>
          <button type="button" class="key" data-digit="9">9</button>
          <button type="button" class="key operator" data-op="×" aria-label="Multiply">×</button>

          <button type="button" class="key" data-digit="4">4</button>
          <button type="button" class="key" data-digit="5">5</button>
          <button type="button" class="key" data-digit="6">6</button>
          <button type="button" class="key operator" data-op="−" aria-label="Subtract">−</button>

          <button type="button" class="key" data-digit="1">1</button>
          <button type="button" class="key" data-digit="2">2</button>
          <button type="button" class="key" data-digit="3">3</button>
          <button type="button" class="key operator" data-op="+" aria-label="Add">+</button>

          <button type="button" class="key utility" data-action="sign" aria-label="Change sign">+/−</button>
          <button type="button" class="key" data-digit="0">0</button>
          <button type="button" class="key" data-action="decimal" aria-label="Decimal point">.</button>
          <button type="button" class="key equals" data-action="calculate" aria-label="Equals">=</button>
        </section>
      </div>

      <!-- ===== HISTORY PANEL (slides over the calculator) ===== -->
      <aside class="history" id="history" aria-label="Calculation history" aria-hidden="true" inert>
        <div class="history-head">
          <h2>History</h2>
          <button type="button" class="close-btn" id="historyClose" aria-label="Close history">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
        <div class="history-list" id="historyList"></div>
        <button type="button" class="clear-history" id="historyClear">Clear history</button>
      </aside>

      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </div>
  </main>

  <script src="engine.js"></script>
  <script src="script.js"></script>
</body>
</html>
